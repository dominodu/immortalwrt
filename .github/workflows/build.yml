name: Build ImmortalWRT ipq53xx

on:
  schedule:
    # 北京时间 04:00 = UTC 20:00（前一天）；GitHub cron 用 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo (contains config pack)
        uses: actions/checkout@v4

      - name: Set build env
        run: |
          # ★ 必须先 export TZ 再取时间；GitHub runner 默认 UTC，否则时间戳差 8 小时
          export TZ=Asia/Shanghai
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          # 精确到秒的时间戳，格式 26.11.19-15.06.45（北京时间）
          echo "BUILD_STAMP=$(date +%y.%m.%d-%H.%M.%S)" >> $GITHUB_ENV
          echo "build time (UTC+8): $(date '+%F %T %Z')"

      - name: Extract v6 config pack
        run: |
          ls -lh v6-config-pack.tar.gz
          tar xzf v6-config-pack.tar.gz
          echo "=== extracted ==="
          ls -ld .config feeds.conf.default files package
          head -3 .config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Clone upstream source (owrt branch, latest)
        run: |
          git clone --depth 1 -b owrt https://github.com/VIKINGYFY/immortalwrt.git source
          echo "SOURCE_HEAD=$(cd source && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Apply v6 config pack
        run: |
          cp -f .config source/.config
          cp -f feeds.conf.default source/feeds.conf.default
          cp -rf files source/files
          cp -rf package/. source/package/
          # 默认 LAN IP 改成 192.168.6.1（按你编译期的设定）
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/bin/config_generate
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/etc/banner 2>/dev/null || true
          grep -n '192.168.6.1' source/package/base-files/files/bin/config_generate | head

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ipq53xx-${{ github.run_id }}
          restore-keys: ccache-ipq53xx-

      - name: Set ccache size
        run: ccache -M 5G

      - name: Feeds + defconfig
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "=== key packages ==="
          grep -E 'CONFIG_PACKAGE_(lucky|nikki|mihomo-meta|logrotate|tcpdump|jq|yq)' .config | head -20

      - name: Build firmware
        working-directory: source
        run: make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          TGT=source/bin/targets/qualcommbe/ipq53xx
          # 保留 sysupgrade / factory / sha256sums 关键字，飞牛下载脚本靠这些匹配
          cp $TGT/*sysupgrade.bin "artifacts/immortalwrt-ipq53xx-sysupgrade-${BUILD_STAMP}.bin" 2>/dev/null || true
          cp $TGT/*factory.bin    "artifacts/immortalwrt-ipq53xx-factory-${BUILD_STAMP}.bin" 2>/dev/null || true
          cp $TGT/sha256sums      "artifacts/sha256sums-${BUILD_STAMP}.txt" 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: "ImmortalWRT ipq53xx · ${{ env.SOURCE_HEAD }} · ${{ env.BUILD_STAMP }}"
          body: |
            - 固件源码 commit：`${{ env.SOURCE_HEAD }}`（上游 VIKINGYFY/immortalwrt owrt 分支）
            - 配置包 commit：`${{ github.sha }}`（本 fork）
            - 构建时间（北京时间）：`${{ env.BUILD_STAMP }}`
          files: artifacts/*
          generate_release_notes: false

      - name: Prune old Releases (keep 2 days)
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
            const rels = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            // 保留最新 1 个，防止清空；只删机器人发的 build-* 标签
            for (const [i, rel] of rels.entries()) {
              if (i === 0) continue;
              if (!rel.tag_name.startsWith('build-')) continue;
              const created = new Date(rel.created_at).getTime();
              if (created < cutoff) {
                core.info(`delete release ${rel.tag_name} (${rel.created_at})`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner, repo: context.repo.repo,
                    release_id: rel.id
                  });
                } catch (e) { core.warning(`deleteRelease failed: ${e.message}`); }
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner, repo: context.repo.repo,
                    ref: `tags/${rel.tag_name}`
                  });
                } catch (e) { core.warning(`deleteRef failed: ${e.message}`); }
              }
            }
