name: Build ImmortalWRT ipq53xx

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo (contains config pack)
        uses: actions/checkout@v4

      - name: Set build env
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: Extract v6 config pack
        run: |
          ls -lh v6-config-pack.tar.gz
          tar xzf v6-config-pack.tar.gz
          echo "=== extracted ==="
          ls -ld .config feeds.conf.default files package
          head -3 .config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Clone upstream source (owrt branch, latest)
        run: |
          git clone --depth 1 -b owrt https://github.com/VIKINGYFY/immortalwrt.git source
          echo "SOURCE_HEAD=$(cd source && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Apply v6 config pack
        run: |
          cp -f .config source/.config
          cp -f feeds.conf.default source/feeds.conf.default
          cp -rf files source/files
          cp -rf package/. source/package/
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/bin/config_generate
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/etc/banner 2>/dev/null || true
          grep -n '192.168.6.1' source/package/base-files/files/bin/config_generate | head

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ipq53xx-${{ github.run_id }}
          restore-keys: ccache-ipq53xx-

      - name: Set ccache size
        run: ccache -M 5G

      - name: Feeds + defconfig
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "=== key packages ==="
          grep -E 'CONFIG_PACKAGE_(lucky|nikki|mihomo-meta|logrotate|tcpdump|jq|yq)' .config | head -20

      - name: Build firmware
        working-directory: source
        run: make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp source/bin/targets/qualcommbe/ipq53xx/*sysupgrade.bin artifacts/ 2>/dev/null || true
          cp source/bin/targets/qualcommbe/ipq53xx/*factory.bin artifacts/ 2>/dev/null || true
          cp source/bin/targets/qualcommbe/ipq53xx/sha256sums artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: "ImmortalWRT ipq53xx · ${{ env.SOURCE_HEAD }} · ${{ env.BUILD_DATE }}"
          files: artifacts/*
          generate_release_notes: false
