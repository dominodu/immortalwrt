name: Build ImmortalWRT ipq53xx

on:
  schedule:
    # 北京时间次日 06:37 = UTC 22:37（前一天）；GitHub cron 用 UTC
    # 放在清晨 6 点、并避开整点高负载时段，确保能拉到前一天 24:00 前提交的全部修改
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo (contains config-ipq53xx.txt)
        uses: actions/checkout@v4

      - name: Set build env
        run: |
          # ★ 必须先 export TZ 再取时间；GitHub runner 默认 UTC，否则时间戳差 8 小时
          export TZ=Asia/Shanghai
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          # 精确到秒的时间戳，格式 yy.mm.dd-hh.mm.ss，如 26.11.19-15.06.45（北京时间）
          echo "BUILD_STAMP=$(date +%y.%m.%d-%H.%M.%S)" >> $GITHUB_ENV
          echo "build time (UTC+8): $(date '+%F %T %Z')"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache

      - name: Clone upstream source (owrt branch, full history, latest)
        run: |
          # 完整克隆（不去 --depth），保留全部 git 历史
          git clone -b owrt https://github.com/VIKINGYFY/immortalwrt.git source
          echo "SOURCE_HEAD=$(cd source && git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "Full clone done. commit count: $(cd source && git rev-list --count HEAD)"

      - name: Apply upstream config + LAN IP
        run: |
          # 软件包基线：上游 IPQ53XX release 的 Config（含 homeproxy+sing-box+lucky 等）
          # feeds 用源码自带的默认 feeds.conf.default（packages/luci/routing/telephony）
          ls -lh config-ipq53xx.txt
          cp -f config-ipq53xx.txt source/.config
          echo "=== key packages check ==="
          grep -E '^CONFIG_PACKAGE_(lucky|luci-app-lucky|luci-app-homeproxy|sing-box|nikki|mihomo-meta)=y$' source/.config || true
          # 默认 LAN IP 改成 192.168.6.1
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/bin/config_generate
          sed -i 's/192\.168\.1\.1/192.168.6.1/g' source/package/base-files/files/etc/banner 2>/dev/null || true
          grep -n '192.168.6.1' source/package/base-files/files/bin/config_generate | head

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ipq53xx-${{ github.run_id }}
          restore-keys: ccache-ipq53xx-

      - name: Set ccache size
        run: ccache -M 5G

      - name: Feeds + defconfig
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "=== key packages after defconfig ==="
          grep -E 'CONFIG_PACKAGE_(lucky|luci-app-lucky|luci-app-homeproxy|sing-box|nikki|mihomo-meta)' .config | head -20

      - name: Build firmware
        working-directory: source
        run: make -j$(nproc) V=s

      - name: Get kernel version
        working-directory: source
        run: |
          KVER=$(cat target/linux/generic/kernel-6.18 2>/dev/null | grep '^LINUX_VERSION-6.18' | sed 's/.*= //')
          [ -n "$KVER" ] || KVER=".x"
          echo "KERNEL_VER=6.18${KVER}" >> $GITHUB_ENV
          echo "Kernel version: 6.18${KVER}"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          TGT=source/bin/targets/qualcommbe/ipq53xx
          # 目标格式：qualcommbe-ipq53xx-jdcloud_re-cs-06-squashfs-factory-owrt-yy.mm.dd-hh.mm.ss.bin
          # 原始产物：immortalwrt-qualcommbe-ipq53xx-jdcloud_re-cs-06-squashfs-factory.bin
          # 处理：去掉开头 immortalwrt-，在扩展名前插入 -owrt-${BUILD_STAMP}
          # 仍带 factory / sysupgrade 关键字，飞牛下载脚本照常匹配
          for f in $TGT/*sysupgrade.bin $TGT/*factory.bin; do
            [ -e "$f" ] || continue
            stem=$(basename "$f" .bin)
            stem=${stem#immortalwrt-}
            cp "$f" "artifacts/${stem}-owrt-${BUILD_STAMP}.bin"
          done
          # sha256sums 不改名：不加时间戳、不加后缀，保持原始文件名
          cp "$TGT/sha256sums" "artifacts/sha256sums" 2>/dev/null || true
          # 软件包清单(OpenWrt 编译时自动生成，列出固件实际安装的全部包+版本)
          cp $TGT/*.manifest artifacts/ 2>/dev/null || true
          # 生成精简的 luci-app / 代理应用列表，供 Release 正文引用
          MF=$(ls $TGT/*.manifest 2>/dev/null | head -1)
          if [ -n "$MF" ]; then
            grep -oE '^(luci-app|luci-i18n)-[a-z0-9-]+' "$MF" | sort -u > artifacts/app-list.txt || true
            grep -iE '^(nikki|mihomo|lucky|sing-box|homeproxy|passwall|logrotate|tcpdump) ' "$MF" | cut -d' ' -f1 | sort -u >> artifacts/app-list.txt || true
            sort -u artifacts/app-list.txt -o artifacts/app-list.txt
            # 写入环境变量供 Release 正文引用（多行 heredoc 语法）
            {
              echo 'APP_LIST<<APPEOF'
              cat artifacts/app-list.txt
              echo 'APPEOF'
            } >> "$GITHUB_ENV"
          fi
          ls -lh artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: "ImmortalWRT ipq53xx · ${{ env.SOURCE_HEAD }} · ${{ env.BUILD_STAMP }}"
          body: |
            这是个京东云赵云BE6500/re-cs-06自用固件包

            源码：https://github.com/VIKINGYFY/immortalwrt.git
            分支：owrt
            提交：${{ env.SOURCE_HEAD }}
            配置：IPQ53XX
            平台：qualcommbe

            登录地址：192.168.6.1
            登录密码：无
            WIFI名称：OWRT
            WIFI密码：12345678

            内核版本：${{ env.KERNEL_VER }}
            插件列表：
            ```
            ${{ env.APP_LIST }}
            ```
            > 完整软件包清单（含所有底层库及版本）见附件 `.manifest` 文件。

          files: artifacts/*
          generate_release_notes: false

      - name: Prune old Releases (keep 2 days)
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
            const rels = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // 保留最新 1 个，防止清空；只删机器人发的 build-* 标签
            for (const [i, rel] of rels.entries()) {
              if (i === 0) continue;
              if (!rel.tag_name.startsWith('build-')) continue;
              const created = new Date(rel.created_at).getTime();
              if (created < cutoff) {
                core.info(`delete release ${rel.tag_name} (${rel.created_at})`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: rel.id
                  });
                } catch (e) {
                  core.warning(`deleteRelease failed: ${e.message}`);
                }
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${rel.tag_name}`
                  });
                } catch (e) {
                  core.warning(`deleteRef failed: ${e.message}`);
                }
              }
            }
